plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.auroramind.meditation'
    compileSdk 35

    defaultConfig {
        applicationId "com.powerofmind.app"
        minSdk 21
        targetSdk 35
        versionCode 10
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Enable runtime support for vector launcher fallback on API < 26
        vectorDrawables.useSupportLibrary = true

        // AdMob Configuration is separated into debug (safe test IDs) and release (real production IDs) build types below.
    }

    // ────────────────────────────────────────────────────────────────────
    // Signing
    //   Fill in your keystore path/passwords (or use environment variables
    //   in CI) AFTER you generate the keystore. See LAUNCH_CHECKLIST.md.
    // ────────────────────────────────────────────────────────────────────
    signingConfigs {
        release {
            def ksPath  = System.getenv("POM_KEYSTORE")  ?: project.findProperty("POM_KEYSTORE")
            def ksAlias = System.getenv("POM_KEY_ALIAS") ?: project.findProperty("POM_KEY_ALIAS")
            def ksPw    = System.getenv("POM_STORE_PASSWORD") ?: project.findProperty("POM_STORE_PASSWORD")
            def keyPw   = System.getenv("POM_KEY_PASSWORD") ?: project.findProperty("POM_KEY_PASSWORD")
            storeFile     ksPath ? file(ksPath) : null
            storePassword ksPw
            keyAlias      ksAlias
            keyPassword   keyPw
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            // ── Production AdMob Settings (REAL IDs for users) ──────────────
            buildConfigField "String", "ADMOB_APP_ID",
                "\"ca-app-pub-7584543130600454~5089915421\""
            manifestPlaceholders.admobAppId = "ca-app-pub-7584543130600454~5089915421"

            // Banner1 — live banner unit
            buildConfigField "String", "ADMOB_BANNER_UNIT_ID",
                "\"ca-app-pub-7584543130600454/8383813088\""
            // Interstitial — live unit for this app ("Guided Meditation Interstitial ad")
            buildConfigField "String", "ADMOB_INTERSTITIAL_UNIT_ID",
                "\"ca-app-pub-7584543130600454/4340930215\""
            // Rewarded ad 1 — live rewarded unit for this app
            buildConfigField "String", "ADMOB_REWARDED_UNIT_ID",
                "\"ca-app-pub-7584543130600454/5844593893\""
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"

            // ── Debug AdMob Settings (SAFE Google Test IDs) ──────────────────
            buildConfigField "String", "ADMOB_APP_ID",
                "\"ca-app-pub-3940256099942544~3347511713\""
            manifestPlaceholders.admobAppId = "ca-app-pub-3940256099942544~3347511713"

            buildConfigField "String", "ADMOB_BANNER_UNIT_ID",
                "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_UNIT_ID",
                "\"ca-app-pub-3940256099942544/1033173712\""
            buildConfigField "String", "ADMOB_REWARDED_UNIT_ID",
                "\"ca-app-pub-3940256099942544/5224354917\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Make sure release builds don't crash on missing google-services.json
    // (Firebase analytics gracefully no-ops without it)
    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media:media:1.7.0'    // MediaSession + MediaStyle

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Google Play Billing (for in-app purchases & subscriptions)
    implementation 'com.android.billingclient:billing-ktx:6.2.1'

    // AdMob (for free tier banner, rewarded, and interstitial ads)
    implementation 'com.google.android.gms:play-services-ads:23.1.0'

    // User Messaging Platform (GDPR/CCPA consent for AdMob in EU/UK)
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'

    // Play In-App Review (3-5x higher completion than market:// intent)
    implementation 'com.google.android.play:review-ktx:2.0.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
