org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Allow compiling against Android 16 (API 36) on AGP 8.6.1, which is officially
# "tested up to compileSdk 35". Google now requires targetSdk 36, and API 36 is
# source-compatible here (the app already handles edge-to-edge insets). This
# downgrades the "untested compileSdk" gate to a warning instead of failing.
android.suppressUnsupportedCompileSdk=36
