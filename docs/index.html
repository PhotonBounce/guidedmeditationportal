<html lang="en">
<head>

<style>
  :root { --bg:#0D0D1F; --card:#16162A; --gold:#F5C842; --purple:#7B5EA7; --text:#fff; --muted:#8888AA; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif; padding:48px 24px; }
  .wrap { max-width: 640px; margin:0 auto; }
  h1 { font-size:36px; margin-bottom:8px; }
  .tag { color:var(--muted); margin-bottom:32px; font-size:14px; letter-spacing:.1em; text-transform:uppercase; }
  .card { background:var(--card); border-radius:16px; padding:24px; margin-bottom:16px; }
  a { color:var(--gold); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .card h2 { font-size:18px; margin-bottom:6px; }
  .card p  { color:var(--muted); font-size:14px; }
  footer { color:var(--muted); font-size:12px; margin-top:32px; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🌙 SoundPad</h1>

    <div class="card">
      <h2><a href="privacy.html">Privacy Policy →</a></h2>
      <p>What we collect (almost nothing) and why.</p>
    </div>

    <div class="card">
      <h2><a href="terms.html">Terms of Service →</a></h2>

    </div>

    <div class="card">

    </div>

    <footer>© 2026 SoundPad. Made for better sleep.</footer>
  </div>
