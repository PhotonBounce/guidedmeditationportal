<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D1F"/>
      <stop offset="60%" stop-color="#1a1838"/>
      <stop offset="100%" stop-color="#0D0D1F"/>
    </linearGradient>
    <radialGradient id="moonGrad2" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFE38A"/>
      <stop offset="100%" stop-color="#F5C842"/>
    </radialGradient>
    <filter id="moonGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#skyGrad)"/>

  <!-- Distant atmosphere -->
  <circle cx="780" cy="220" r="220" fill="#7B5EA7" opacity="0.13"/>
  <circle cx="780" cy="220" r="160" fill="#7B5EA7" opacity="0.12"/>

  <!-- Moon -->
  <g filter="url(#moonGlow2)">
    <path d="M830 130
             a 90 90 0 1 0 0 180
             a 65 65 0 1 1 0 -180 z"
          fill="url(#moonGrad2)"/>
  </g>

  <!-- Stars sprinkled -->
  <g fill="#F5C842" opacity="0.9">
    <circle cx="60"  cy="80"  r="2"/>
    <circle cx="140" cy="170" r="1.6"/>
    <circle cx="220" cy="60"  r="2.2"/>
    <circle cx="300" cy="120" r="1.4"/>
    <circle cx="380" cy="200" r="2"/>
    <circle cx="490" cy="70"  r="2.6"/>
    <circle cx="560" cy="160" r="1.8"/>
    <circle cx="640" cy="100" r="2"/>
    <circle cx="700" cy="60"  r="1.6"/>
    <circle cx="900" cy="380" r="2"/>
    <circle cx="80"  cy="400" r="1.8"/>
    <circle cx="200" cy="370" r="2.2"/>
    <circle cx="170" cy="430" r="1.4"/>
    <path d="M340 350 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z"/>
    <path d="M620 380 l2.5 5 l5 2.5 l-5 2.5 l-2.5 5 l-2.5 -5 l-5 -2.5 l5 -2.5 z"/>
    <path d="M450 420 l2 4 l4 2 l-4 2 l-2 4 l-2 -4 l-4 -2 l4 -2 z"/>
  </g>

  <!-- Title -->
  <text x="80" y="220" font-family="-apple-system, Segoe UI, Helvetica, sans-serif"
        font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="-2">
    SoundPad
  </text>

  <!-- Tagline -->
  <text x="82" y="270" font-family="-apple-system, Segoe UI, Helvetica, sans-serif"
        font-size="28" font-weight="500" fill="#F5C842">
    Sleep · Focus · Relax
  </text>

  <!-- Sub-tagline -->
  <text x="82" y="320" font-family="-apple-system, Segoe UI, Helvetica, sans-serif"
        font-size="20" fill="#8888AA">
    14 immersive sounds. 8-hour sleep timer. Plays in background.
  </text>

  <!-- Pills row -->
  <g font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(82, 360)">
      <rect width="120" height="36" rx="18" fill="#16162A" stroke="#7B5EA7"/>
      <text x="60" y="23" text-anchor="middle" fill="#FFFFFF">⬜ White</text>
    </g>
    <g transform="translate(214, 360)">
      <rect width="120" height="36" rx="18" fill="#16162A" stroke="#7B5EA7"/>
      <text x="60" y="23" text-anchor="middle" fill="#FFFFFF">🌸 Pink</text>
    </g>
    <g transform="translate(346, 360)">
      <rect width="120" height="36" rx="18" fill="#16162A" stroke="#7B5EA7"/>
      <text x="60" y="23" text-anchor="middle" fill="#FFFFFF">🟤 Brown</text>
    </g>
    <g transform="translate(478, 360)">
      <rect width="120" height="36" rx="18" fill="#1C1A10" stroke="#F5C842"/>
      <text x="60" y="23" text-anchor="middle" fill="#F5C842">🌧 Rain</text>
    </g>
    <g transform="translate(610, 360)">
      <rect width="120" height="36" rx="18" fill="#1C1A10" stroke="#F5C842"/>
      <text x="60" y="23" text-anchor="middle" fill="#F5C842">🌊 Ocean</text>
    </g>
  </g>
</svg>
