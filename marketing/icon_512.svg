<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="100%" stop-color="#0D0D1F"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFE38A"/>
      <stop offset="50%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#D4A930"/>
    </radialGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="0" fill="url(#bgGrad)"/>

  <!-- Soft purple atmosphere -->
  <circle cx="256" cy="240" r="190" fill="#7B5EA7" opacity="0.18"/>
  <circle cx="256" cy="240" r="150" fill="#7B5EA7" opacity="0.12"/>

  <!-- Crescent moon -->
  <g filter="url(#moonGlow)">
    <path d="M310 140
             a 110 110 0 1 0 0 220
             a 80 80 0 1 1 0 -220 z"
          fill="url(#moonGrad)"/>
  </g>

  <!-- Stars -->
  <g fill="#F5C842">
    <path d="M140 165 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 z"/>
    <path d="M385 380 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z"/>
    <path d="M130 360 l2.5 5 l5 2.5 l-5 2.5 l-2.5 5 l-2.5 -5 l-5 -2.5 l5 -2.5 z"/>
    <circle cx="400" cy="160" r="3"/>
    <circle cx="110" cy="280" r="2"/>
    <circle cx="420" cy="280" r="2"/>
  </g>
</svg>
