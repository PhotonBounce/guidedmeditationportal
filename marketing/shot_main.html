<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_shot_styles.css">
<title>Main</title>
</head>
<body>
<div class="shot">
  <div class="toolbar">🌙 SoundPad</div>
  <div class="now-playing">🌸 Pink Noise · Playing</div>

  <div class="section-label">SOUNDS</div>
  <div class="grid">
    <div class="card"><div class="emoji">⬜</div><div class="name">White</div></div>
    <div class="card active"><div class="emoji">🌸</div><div class="name">Pink</div></div>
    <div class="card"><div class="emoji">🟤</div><div class="name">Brown</div></div>
    <div class="card"><div class="emoji">🌊</div><div class="name">Ocean</div><div class="lock">🔒</div></div>
    <div class="card"><div class="emoji">🌧️</div><div class="name">Rain</div><div class="lock">🔒</div></div>
    <div class="card"><div class="emoji">🔥</div><div class="name">Campfire</div><div class="lock">🔒</div></div>
  </div>

  <div class="timer-row">
    <div class="btn-play">⏹ Stop</div>
    <div class="btn-timer">⏱ 1:23:45</div>
  </div>
</div>
</body>
</html>
