name: Release AAB (signed)

# Builds the signed release AAB for Play Console upload.
# Requires 4 repo secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64            — the release .jks file, base64-encoded
#   MEDITATION_KEY_ALIAS       — key alias inside the keystore
#   MEDITATION_STORE_PASSWORD  — keystore password
#   MEDITATION_KEY_PASSWORD    — key password

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks

      - name: Build signed release AAB
        env:
          MEDITATION_KEYSTORE: /tmp/release.jks
          MEDITATION_KEY_ALIAS: ${{ secrets.MEDITATION_KEY_ALIAS }}
          MEDITATION_STORE_PASSWORD: ${{ secrets.MEDITATION_STORE_PASSWORD }}
          MEDITATION_KEY_PASSWORD: ${{ secrets.MEDITATION_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuidedMeditationPortal-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
