name: Release AAB (signed)

# Builds a Play Store-ready, signed Android App Bundle.
#
# Add these repository secrets first (Settings -> Secrets and variables -> Actions):
#   POM_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
#   POM_STORE_PASSWORD   keystore password
#   POM_KEY_PASSWORD     key password
#   POM_KEY_ALIAS        key alias (e.g. powerofmind)
#
# Then run this workflow (Actions -> Release AAB -> Run workflow) and download
# the signed .aab from the run's Artifacts to upload in the Play Console.

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.POM_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release AAB
        env:
          POM_KEYSTORE: ${{ runner.temp }}/upload.jks
          POM_KEY_ALIAS: ${{ secrets.POM_KEY_ALIAS }}
          POM_STORE_PASSWORD: ${{ secrets.POM_STORE_PASSWORD }}
          POM_KEY_PASSWORD: ${{ secrets.POM_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-of-mind-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
