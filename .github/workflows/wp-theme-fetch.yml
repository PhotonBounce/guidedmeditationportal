name: Fetch WordPress child theme files

on:
  workflow_dispatch:
    inputs:
      ftp_pass:
        description: 'FTP password'
        required: true

jobs:
  fetch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download child theme files via FTP
        run: |
          pip install -q ftputil
          python3 << 'PYEOF'
          import ftputil, os

          HOST = 'ftp.photon-bounce.com'
          USER = 'photonb'
          PASS = '${{ inputs.ftp_pass }}'

          with ftputil.FTPHost(HOST, USER, PASS) as ftp:
              themes = ftp.listdir('public_html/wp-content/themes')
              print("Themes:", themes)
              for theme in themes:
                  base = f'public_html/wp-content/themes/{theme}'
                  os.makedirs(f'wp-theme-dump/{theme}', exist_ok=True)
                  for fname in ['style.css', 'functions.php', 'front-page.php', 'home.php', 'header.php', 'index.php']:
                      remote = f'{base}/{fname}'
                      local  = f'wp-theme-dump/{theme}/{fname}'
                      try:
                          ftp.download(remote, local)
                          print(f"  got {remote}")
                      except Exception as e:
                          print(f"  skip {remote}: {e}")
          PYEOF

      - name: Commit theme dump
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add wp-theme-dump/
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "chore: dump WordPress child theme files"
          git push origin main
