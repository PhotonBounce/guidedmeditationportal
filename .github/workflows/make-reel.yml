name: Make Narrated Reel

# Builds the viral vertical explainer with ElevenLabs premium narration.
# Requires repo secret ELEVENLABS_API_KEY (Settings -> Secrets -> Actions).
# Optional secret/var ELEVENLABS_VOICE_ID to change the voice.

on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: 'ElevenLabs voice ID (optional; default = Matilda, warm)'
        required: false
        default: 'XrExE9yKIg1WjnnlVkGX'

jobs:
  reel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet Pillow
      - name: Build narrated reel
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ github.event.inputs.voice_id }}
        run: bash video/make_reel.sh
      - name: Upload reel
        uses: actions/upload-artifact@v4
        with:
          name: GMP-narrated-reel
          path: video/GMP_reel_final.mp4
          if-no-files-found: error
          retention-days: 30
