name: APK to Website

# Publishes the v1.4.0 test APK to photon-bounce.com/guidedmeditation/ so a
# phone can download and install it directly (the GitHub release needs a
# login because the repo is private; the website does not).

on:
  workflow_dispatch:
    inputs:
      ftp_pass:
        description: FTP password
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.4.0-test --pattern '*.apk'

      - name: Upload APK via FTP
        env:
          FTP_PASS: ${{ inputs.ftp_pass }}
        run: python3 push_apk_to_site.py
