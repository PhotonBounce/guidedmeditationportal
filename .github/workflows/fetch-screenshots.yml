name: Commit Screenshots

# Downloads the store-screenshots artifact from a build run and commits the
# PNGs to the branch so they can be reviewed and shipped from the repo.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID that produced the store-screenshots artifact
        required: true
        type: string

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download screenshots artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf store_screenshots && mkdir store_screenshots
          gh run download "${{ inputs.run_id }}" --name store-screenshots --dir store_screenshots

      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store_screenshots/
          git commit -m "Add emulator-captured store screenshots"
          git push
