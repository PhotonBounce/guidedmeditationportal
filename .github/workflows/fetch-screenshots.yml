name: Commit Screenshots

# Downloads a screenshots artifact from a build run and commits the PNGs to
# the branch so they can be reviewed and shipped from the repo.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID that produced the artifact
        required: true
        type: string
      artifact:
        description: Artifact name
        required: true
        type: string
        default: store-screenshots
      outdir:
        description: Directory to commit the files into
        required: true
        type: string
        default: store_screenshots

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download screenshots artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "${{ inputs.outdir }}" && mkdir "${{ inputs.outdir }}"
          gh run download "${{ inputs.run_id }}" --name "${{ inputs.artifact }}" --dir "${{ inputs.outdir }}"

      - name: Commit to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.outdir }}/"
          git commit -m "Add emulator-captured screenshots (${{ inputs.artifact }})"
          git push
