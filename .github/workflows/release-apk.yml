name: Release APK

# Builds the debug APK and publishes it as a GitHub pre-release so it can be
# downloaded and installed directly from a phone browser.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publish APK as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GuidedMeditationPortal-v1.4.1.apk
          gh release delete v1.4.1-test --yes 2>/dev/null || true
          gh release create v1.4.1-test GuidedMeditationPortal-v1.4.1.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "v1.4.1 test APK" \
            --notes "Debug APK for phone install. Download the .apk below on your phone and tap to install."
