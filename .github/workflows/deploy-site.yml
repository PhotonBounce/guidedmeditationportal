name: Deploy Website

# Uploads the Power of Mind microsite (microsite/) to
# photon-bounce.com/pom via FTP. Triggered manually.
#
# The FTP password is read from the FTP_PASS repository secret (preferred) or,
# if that secret is not set, from the ftp_pass run input as a fallback. It is
# only ever handed to the script through an environment variable — never
# committed or printed.

on:
  workflow_dispatch:
    inputs:
      ftp_pass:
        description: FTP password (only needed if the FTP_PASS secret is not set)
        required: false
        type: string

permissions:
  contents: read
  actions: read   # to download the release APK artifact

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish the signed APK next to the site so the "Download for Android"
      # button works: photon-bounce.com/pom/PowerOfMind.apk. Soft-fails so a
      # site-only deploy still goes out (the previously uploaded APK stays
      # live on the host — deploy_shield never deletes remote files).
      - name: Fetch latest signed release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          run_id=$(gh run list --workflow "Release AAB (signed)" --status success \
                     --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" -n power-of-mind-release-apk -D apk_tmp; then
            mv apk_tmp/app-release.apk microsite/PowerOfMind.apk
            ls -lh microsite/PowerOfMind.apk
          else
            echo "::warning::No release APK artifact found — deploying site without refreshing the APK."
          fi

      - name: Upload microsite via FTP
        env:
          FTP_PASS: ${{ secrets.FTP_PASS || inputs.ftp_pass }}
        run: python3 deploy_shield.py
