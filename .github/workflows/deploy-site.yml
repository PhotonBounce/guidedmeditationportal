name: Deploy Website

# Uploads the Mind & Body Shield microsite (microsite/) to
# photon-bounce.com/shield via FTP. Triggered manually; the FTP password is
# passed as a run input (private repo) and only ever handed to the script
# through an environment variable — never committed or printed.

on:
  workflow_dispatch:
    inputs:
      ftp_pass:
        description: FTP password
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload microsite via FTP
        env:
          FTP_PASS: ${{ inputs.ftp_pass }}
        run: python3 deploy_shield.py
