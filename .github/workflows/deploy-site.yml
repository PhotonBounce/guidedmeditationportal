name: Deploy Website

# Uploads meditation-portal-site.zip contents to photon-bounce.com/ausis via FTP.
# Triggered manually; the FTP password is passed as a run input (private repo)
# and only ever handed to the script through an environment variable.

on:
  workflow_dispatch:
    inputs:
      ftp_pass:
        description: FTP password
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site via FTP
        env:
          FTP_PASS: ${{ inputs.ftp_pass }}
        run: python3 ftp_deploy.py
